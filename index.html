<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game by Meraj</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="" class="player">
        <div>
        <h3>Tic-Tac-Toe</h3>
        <h2>Enter players name</h2>
        <div class="player1 input-box">
        <label for="p1">Player1</label>
        <input id="p1" type="text" placeholder="Ex-Abc">
        </div>
        <div class="player2 input-box">
        <label for="p2">Player2</label>
        <input id="p2" type="text" placeholder="Ex-Abc">
        </div>
        <button id="start-btn">Start Game</button>
        </div>
    </form>

    <main class="main main-container">
        <h1>Tic Toc Toe</h1>
        <div class="msg-Container hide">
            <p id="msg">Congratulations</p>
            <button class="playAgain-btn hide-playBtn">Play Again</button>
        </div>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="resetBtn">Reset Game</button>

    <script src="script.js"></script>
</body>

</html>
